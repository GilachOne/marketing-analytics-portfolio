<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Marketing Analytics · Portfolio</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#vk"
        >◈
        <span>MARKETING<span class="subbrand">ANALYTICS / DEMO</span></span></a
      >
      <div class="nav-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav>
        <button data-page="vk">◫ <span>Дашборд ВК</span></button
        ><button data-page="ao">▥ <span>Дашборд АО</span></button
        ><button data-page="managers">◎ <span>Воронка Б24</span></button>
      </nav>
      <div class="side-note">
        <span class="live-dot"></span> Демонстрационная версия
        <p>Все проекты, сотрудники и показатели вымышлены.</p>
        <a href="docs/METHODOLOGY.md">Методика расчёта ↗</a>
      </div>
    </aside>
    <main>
      <div class="eyebrow">ПОРТФОЛИО / СКВОЗНАЯ АНАЛИТИКА</div>
      <header>
        <div>
          <h1 id="title"></h1>
          <p id="subtitle"></p>
        </div>
        <span class="demo-pill">СИНТЕТИЧЕСКИЕ ДАННЫЕ</span>
      </header>
      <div id="tabs" class="tabs"></div>
      <section class="toolbar">
        <div class="presets">
          <button data-month="09">Сентябрь</button
          ><button data-month="10">Октябрь</button
          ><button data-month="11">Ноябрь</button>
        </div>
        <label
          >Начало<input
            id="from"
            aria-label="Начало периода"
            type="date"
            value="2026-11-01"
            min="2026-09-01"
            max="2026-11-23" /></label
        ><label
          >Конец<input
            id="to"
            aria-label="Конец периода"
            type="date"
            value="2026-11-23"
            min="2026-09-01"
            max="2026-11-23" /></label
        ><label
          >Проект<select id="project">
            <option value="">Все проекты</option>
          </select></label
        ><label class="check"
          ><input type="checkbox" id="cohort" />Прикреплять к лидам</label
        >
      </section>
      <p id="mode" class="mode"></p>
      <div id="error" role="alert"></div>
      <section id="kpis" class="kpis"></section>
      <div id="content"></div>
      <footer>
        Portfolio edition · Не подключено к рабочим API · Данные по 23 ноября
        2026
      </footer>
    </main>
    <script type="module" src="src/app.mjs"></script>
  </body>
</html>
